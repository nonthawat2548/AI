<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Fieldnotes — หน้าเดียว</title>
<meta name="description" content="AI Fieldnotes หน้าเดียว Lecture, Lab และข้อสอบ 100 ข้อ">
<style>body{font:16px/1.6 system-ui,sans-serif;background:#f2f4fa;color:#25334e;margin:0}.loading{min-height:100vh;display:grid;place-items:center}.loading div{text-align:center;padding:24px}h1{font-size:23px}p{color:#64748b}.error{white-space:pre-wrap}</style>
</head>
<body><main class="loading"><div><h1>AI Fieldnotes</h1><p>กำลังเปิดคู่มือแบบหน้าเดียวยาวต่อเนื่อง…</p></div></main>
<script>
(async()=>{
 try {
  const [base,patch]=await Promise.all([
   fetch('./source.html').then(r=>{if(!r.ok)throw new Error('โหลดเนื้อหาต้นฉบับไม่สำเร็จ');return r.text()}),
   fetch('./onepage.patch.json').then(r=>{if(!r.ok)throw new Error('โหลดการปรับหน้าเดียวไม่สำเร็จ');return r.json()})
  ]);
  const lines=base.match(/[^\n]*\n|[^\n]+$/g)||[];
  for(let i=patch.ops.length-1;i>=0;i--){
   const op=patch.ops[i];
   const next=op.insert.match(/[^\n]*\n|[^\n]+$/g)||[];
   lines.splice(op.start,op.remove,...next);
  }
  if(lines.length!==patch.targetLineCount)throw new Error('โครงสร้างเอกสารไม่ตรงกับเวอร์ชันที่รองรับ');
  document.open();document.write(lines.join(''));document.close();
 }catch(error){document.querySelector('main').innerHTML='<div><h1>เปิดคู่มือไม่ได้</h1><p class="error"></p></div>';document.querySelector('.error').textContent=error.message;}
})();
</script></body></html>
