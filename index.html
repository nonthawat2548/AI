<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Fieldnotes — เนื้อหาครบและแนวสอบ Final 1/2569</title><style>body{margin:0;background:#f2f4fa;color:#202b46;font:16px/1.8 system-ui,sans-serif}.load{max-width:650px;margin:20vh auto;padding:28px}.load p{color:#788299}</style></head><body><main class="load"><h1>AI Fieldnotes</h1><p>กำลังเปิดเนื้อหาฉบับเต็มและหน้าข้อสอบ…</p></main><script>
(async()=>{try{
const get=async(path,json)=>{const r=await fetch('./'+path);if(!r.ok)throw Error('โหลด '+path+' ไม่สำเร็จ ('+r.status+')');return json?r.json():r.text()};
const [source,one,bundle]=await Promise.all([get('source.html'),get('onepage.patch.json',true),get('final-2569.bundle.json',true)]);
const apply=(text,patch)=>{const lines=text.match(/[^\n]*\n|[^\n]+$/g)||[];if(patch.baseLineCount&&lines.length!==patch.baseLineCount)throw Error('รุ่นเนื้อหาต้นทางไม่ตรง');for(let i=patch.ops.length-1;i>=0;i--){const o=patch.ops[i];lines.splice(o.start,o.remove,...(o.insert.match(/[^\n]*\n|[^\n]+$/g)||[]))}if(lines.length!==patch.targetLineCount)throw Error('จำนวนบรรทัดเนื้อหาไม่ครบ');return lines.join('')};
const baseline=apply(source,one);
const bytes=Uint8Array.from(atob(bundle.data),x=>x.charCodeAt(0));
const patch=JSON.parse(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
if(crypto.subtle&&patch.baseSha256){const raw=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(baseline));const sha=Array.from(new Uint8Array(raw),x=>x.toString(16).padStart(2,'0')).join('');if(sha!==patch.baseSha256)throw Error('เนื้อหาต้นทางไม่ตรงกับฉบับที่ตรวจสอบ');}
const content=apply(baseline,patch);document.open();document.write(content);document.close();
}catch(e){const p=document.querySelector('.load p');if(p)p.textContent='เปิดบทเรียนไม่สำเร็จ: '+e.message;}})();
</script></body></html>
